# Production builds run the [CONFIRM] guard: the deploy fails while any
# unconfirmed client detail is still on the site. Previews skip the guard so
# the client can review drafts (placeholders show as highlighted chips).
[build]
  command = "npm run build:prod"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# ---------------------------------------------------------------- old URLs
[[redirects]]
  from = "/physical-wellness/*"
  to = "/behavioral-health/treatment/"
  status = 301
  force = true

[[redirects]]
  from = "/social-wellness-healing-arts/*"
  to = "/behavioral-health/treatment/"
  status = 301
  force = true

[[redirects]]
  from = "/spiritual-wellness/*"
  to = "/behavioral-health/treatment/"
  status = 301
  force = true

[[redirects]]
  from = "/mental-health/*"
  to = "/behavioral-health/"
  status = 301
  force = true

# ---------------------------------------------------------------- headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
